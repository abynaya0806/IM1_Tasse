    <main>
        <h1>Get in Touch</h1>
        <form action="">
            <label for="vorname">Vorname:</label>
            <input type="text" name="vorname" id="vorname" required placeholder="Max">

            <label for="nachname">Nachname:</label>
            <input type="text" name="nachname" id="nachname" required placeholder="Mustermann">

            <label for="email">E-Mail-Adresse:</label>
            <input type="email" name="email" id="email" required placeholder="max.muster@beispiel.ch">

            <label for="nachricht">Deine Nachricht an mich:</label>
            <textarea name="nachricht" id="nachricht" cols="30" rows="10" required placeholder="Hallihalo …"></textarea>

            <label for="agb">Ich akzeptiere die AGB's</label>
            <input type="checkbox" name="agb" id="agb" required>

            <input type="submit" value="Kontakt aufnehmen">
        </form>
